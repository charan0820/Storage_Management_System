<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850"><rect width="1120" height="850" fill="#f5f8f6"/><style>text{font-family:Arial,sans-serif;fill:#19382f}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.small{font-size:14px}.wire{fill:none;stroke-width:3}.power{stroke:#d05a4b}.ground{stroke:#536972}.signal{stroke:#29876c}.echo{stroke:#ac7b23}</style><text x="40" y="50" class="title">StoreWatch · 3 shelves / 1 ESP32</text><text x="40" y="80" class="small">Classic ESP32 DevKit GPIO numbers · Common ground · Each Echo has its own voltage divider</text><rect x="805" y="125" width="270" height="580" rx="16" fill="#19382f"/><text x="840" y="166" style="fill:white;font-size:25px;font-weight:700">ESP32 DevKit</text><text x="840" y="190" style="fill:#b7d8c9;font-size:14px">USB to laptop / regulated power</text><rect x="40" y="140" width="205" height="130" rx="12" fill="white" stroke="#b8d0c1"/><text x="55" y="167" class="head">HC-SR04 #1</text><text x="55" y="189" class="small">SHELF_01</text><text x="55" y="215" class="small">VCC</text><text x="55" y="238" class="small">TRIG</text><text x="150" y="215" class="small">GND</text><text x="150" y="238" class="small">ECHO</text>
