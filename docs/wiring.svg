<path d="M520 245 H710 V275 H820" class="wire echo"/><text x="840" y="281" style="fill:white;font-size:17px">GPIO 32 ← ECHO #1</text><path d="M520 245 V256" class="wire echo"/><rect x="508" y="256" width="24" height="32" fill="#fff1d4" stroke="#ac7b23"/><text x="547" y="279" class="small">2 kΩ</text><path d="M520 288 V300 H290" class="wire ground"/><text x="570" y="221" class="small">Junction ≈ 3.33 V</text><rect x="40" y="315" width="205" height="130" rx="12" fill="white" stroke="#b8d0c1"/><text x="55" y="342" class="head">HC-SR04 #2</text><text x="55" y="364" class="small">SHELF_02</text><text x="55" y="390" class="small">VCC</text><text x="55" y="413" class="small">TRIG</text><text x="150" y="390" class="small">GND</text><text x="150" y="413" class="small">ECHO</text>
