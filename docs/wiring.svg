<path d="M185 420 H365" class="wire echo"/><rect x="365" y="409" width="68" height="22" fill="#fff1d4" stroke="#ac7b23"/><text x="377" y="401" class="small">1 kΩ</text><path d="M433 420 H520" class="wire echo"/><circle cx="520" cy="420" r="5" fill="#ac7b23"/>
<path d="M520 420 H710 V450 H820" class="wire echo"/><text x="840" y="456" style="fill:white;font-size:17px">GPIO 33 ← ECHO #2</text><path d="M520 420 V431" class="wire echo"/><rect x="508" y="431" width="24" height="32" fill="#fff1d4" stroke="#ac7b23"/><text x="547" y="454" class="small">2 kΩ</text><path d="M520 463 V475 H290" class="wire ground"/><text x="570" y="396" class="small">Junction ≈ 3.33 V</text><rect x="40" y="490" width="205" height="130" rx="12" fill="white" stroke="#b8d0c1"/><text x="55" y="517" class="head">HC-SR04 #3</text><text x="55" y="539" class="small">SHELF_03</text><text x="55" y="565" class="small">VCC</text><text x="55" y="588" class="small">TRIG</text><text x="150" y="565" class="small">GND</text><text x="150" y="588" class="small">ECHO</text>
