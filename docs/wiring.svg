<path d="M520 595 H710 V625 H820" class="wire echo"/><text x="840" y="631" style="fill:white;font-size:17px">GPIO 34 ← ECHO #3</text><path d="M520 595 V606" class="wire echo"/><rect x="508" y="606" width="24" height="32" fill="#fff1d4" stroke="#ac7b23"/><text x="547" y="629" class="small">2 kΩ</text><path d="M520 638 V650 H290" class="wire ground"/><text x="570" y="571" class="small">Junction ≈ 3.33 V</text><text x="840" y="226" style="fill:#ffc1b8;font-size:16px">5 V / VIN* → sensor VCC</text><text x="840" y="656" style="fill:#cfdbde;font-size:16px">GND ↔ common ground</text><text x="40" y="743" class="head">Echo → 1 kΩ → GPIO junction → 2 kΩ → GND (repeat for all three sensors)</text><text x="40" y="775" class="small">* Verify your DevKit provides USB 5 V on this pin. Never connect sensor Echo directly to ESP32.</text><text x="40" y="801" class="small">Wires crossing are not joined unless a junction dot is shown. Power / ground rails join each sensor.</text><text x="40" y="827" class="small">Mount one sensor above each controlled stack. Sequential pings with ≥65 ms quiet gaps reduce crosstalk.</text></svg>