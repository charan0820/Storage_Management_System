<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">StoreWatch two-row ESP32 connection map</title><desc id="desc">GPIO25 triggers sensor one; GPIO32 receives its divided Echo. GPIO26 triggers sensor two; GPIO33 receives its divided Echo. Each Echo has an independent 1k and 2k divider. Both sensors share 5 volts and ground.</desc>
<rect width="1100" height="660" fill="#f6f8f7"/><g font-family="Segoe UI, sans-serif" fill="#25332f"><text x="40" y="48" font-size="26" font-weight="700">Two rows. One controller.</text><text x="40" y="76" font-size="14">Classic ESP32-WROOM-32 DevKit · GPIO numbers, not header positions</text>
<rect x="40" y="170" width="235" height="335" rx="12" fill="#253e32"/><g fill="#fff"><text x="68" y="215" font-size="24" font-weight="700">ESP32_01</text><text x="68" y="243" font-size="13">USB → laptop / 5 V power</text><text x="190" y="286">GPIO25</text><text x="190" y="326">GPIO32</text><text x="190" y="396">GPIO26</text><text x="190" y="436">GPIO33</text></g>
<rect x="765" y="155" width="290" height="145" rx="9" fill="#fff" stroke="#9db4a6"/><text x="790" y="184" font-size="18" font-weight="700">HC-SR04 #1 · US_01</text><text x="790" y="208" font-size="13">Row 1 / SHELF_01</text><text x="790" y="235" fill="#236449">TRIG ← GPIO25</text><text x="790" y="259" fill="#88571a">ECHO → divider → GPIO32</text><text x="790" y="282" font-size="12">VCC → 5 V      GND → common GND</text>
<rect x="765" y="355" width="290" height="145" rx="9" fill="#fff" stroke="#9db4a6"/><text x="790" y="384" font-size="18" font-weight="700">HC-SR04 #2 · US_02</text><text x="790" y="408" font-size="13">Row 2 / SHELF_02</text><text x="790" y="435" fill="#236449">TRIG ← GPIO26</text><text x="790" y="459" fill="#88571a">ECHO → divider → GPIO33</text><text x="790" y="482" font-size="12">VCC → 5 V      GND → common GND</text>
<g fill="none" stroke-width="2.5"><path d="M275 280 H310 V130 H740 V230 H765" stroke="#236449"/><path d="M275 390 H340 V355 H740 V430 H765" stroke="#236449"/><path d="M765 255 H660" stroke="#a5722b"/><path d="M590 255 H380 V320 H275" stroke="#a5722b"/><path d="M765 455 H660" stroke="#a5722b"/><path d="M590 455 H380 V430 H275" stroke="#a5722b"/><path d="M485 255 V287 M485 327 V345 H705 M485 455 V487 M485 527 V545 H705" stroke="#6a766f"/></g>
<g fill="#fff" stroke="#a5722b" stroke-width="2"><rect x="590" y="244" width="70" height="22"/><rect x="590" y="444" width="70" height="22"/></g><g fill="#fff" stroke="#6a766f" stroke-width="2"><rect x="474" y="287" width="22" height="40"/><rect x="474" y="487" width="22" height="40"/></g>
<text x="605" y="260" font-size="12">1 kΩ</text><text x="605" y="460" font-size="12">1 kΩ</text><text x="510" y="312" font-size="12">2 kΩ</text><text x="510" y="512" font-size="12">2 kΩ</text><text x="620" y="340" font-size="12">Common GND</text><text x="620" y="540" font-size="12">Common GND</text><circle cx="485" cy="255" r="4" fill="#a5722b"/><circle cx="485" cy="455" r="4" fill="#a5722b"/>
<rect x="40" y="566" width="1015" height="68" rx="8" fill="#fff3dd"/><text x="60" y="593" font-size="15" font-weight="700">Never connect a 5 V Echo directly to an ESP32 input.</text><text x="60" y="617" font-size="13">Each Echo needs its own divider. Verify ~3.3 V at the junction. Shared regulated 5 V and common GND for both sensors.</text></g></svg>
