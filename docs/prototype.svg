<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc"><title id="title">Two-row cardboard shelf, top view</title><desc id="desc">A shelf 30 cm deep with two 12 cm wide rows. Each has a rear sensor, a sliding flat follower, and products toward the front. A smaller sensor to follower distance indicates more stock.</desc><rect width="1100" height="640" fill="#f6f8f7"/><g font-family="Segoe UI, sans-serif" fill="#25332f"><text x="40" y="45" font-size="26" font-weight="700">Your cardboard grocery shelf</text><text x="40" y="74" font-size="14">Top view · Two side-by-side rows · Suggested clear depth 30 cm</text><text x="65" y="136" font-size="13">REAR / sensors</text><text x="810" y="136" font-size="13">FRONT / customer</text><rect x="60" y="155" width="910" height="320" rx="4" fill="#e8dcc6" stroke="#ac9770" stroke-width="5"/><rect x="85" y="174" width="860" height="126" fill="#fcfaf5"/><rect x="85" y="326" width="860" height="126" fill="#fcfaf5"/><path d="M60 313 H970" stroke="#ac9770" stroke-width="9"/>
<g fill="#304f3c"><rect x="88" y="213" width="65" height="46" rx="5"/><rect x="88" y="365" width="65" height="46" rx="5"/></g><g fill="#b6c7bd"><circle cx="143" cy="225" r="9"/><circle cx="143" cy="248" r="9"/><circle cx="143" cy="377" r="9"/><circle cx="143" cy="400" r="9"/></g><text x="92" y="195" font-size="12">US_01</text><text x="92" y="347" font-size="12">US_02</text>
<g stroke="#65816d" stroke-width="2" stroke-dasharray="7 6" fill="none"><path d="M165 236 H405"/><path d="M165 388 H687"/></g><text x="195" y="224" font-size="13">Distance to follower</text><text x="195" y="376" font-size="13">More free space = less stock</text><g fill="#6a8974"><rect x="415" y="190" width="14" height="96"/><rect x="697" y="342" width="14" height="96"/></g><g fill="#b8d1bf" stroke="#7c9d85"><rect x="440" y="202" width="104" height="70" rx="3"/><rect x="555" y="202" width="104" height="70" rx="3"/><rect x="670" y="202" width="104" height="70" rx="3"/><rect x="785" y="202" width="104" height="70" rx="3"/></g><g fill="#e8cc95" stroke="#b79456"><rect x="723" y="354" width="76" height="70" rx="3"/><rect x="810" y="354" width="76" height="70" rx="3"/></g><g font-size="12" text-anchor="middle"><text x="492" y="242">TEA-001</text><text x="607" y="242">TEA-001</text><text x="722" y="242">TEA-001</text><text x="837" y="242">TEA-001</text><text x="761" y="394">BIS-002</text><text x="848" y="394">BIS-002</text></g><g stroke="#ac9770" stroke-width="7"><path d="M914 193 V280 M914 345 V432"/></g>
<path d="M156 496 H914 M156 490 V502 M914 490 V502" stroke="#63716a"/><text x="490" y="520" font-size="13">~30 cm to empty follower position</text><text x="990" y="235" font-size="13">~12 cm</text><text x="990" y="387" font-size="13">~12 cm</text><rect x="60" y="548" width="910" height="68" rx="8" fill="#eaf3ed"/><text x="80" y="575" font-size="14" font-weight="700">The upright green plate is a manual sliding follower.</text><text x="80" y="598" font-size="13">Slide it against remaining products after each removal. Full stop ~5 cm; empty stop ~30 cm. Calibrate actual distances.</text></g></svg>
