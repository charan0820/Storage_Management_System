# StoreWatch configuration
# Single source of truth for thresholds, device/shelf mapping, and
# communication settings. The ESP32 fetches row assignments from the HTTP
# manifest; firmware Wi-Fi credentials live only in ignored secrets.h.

app:
  name: StoreWatch
  timezone: UTC

# --- Shelf classification thresholds (distance sensor, cm) ---
# THESE ARE PLACEHOLDERS. Calibrate experimentally per Section 6/30
# before relying on them for the demo.
thresholds:
  full_max_cm: 5        # distance < this          -> FULL
  low_stock_max_cm: 20   # this <= distance < below -> LOW_STOCK
  # distance >= low_stock_max_cm                    -> EMPTY

# --- Data filtering ---
filtering:
  moving_average_window: 5   # number of samples averaged, see Section 7

# --- Device health ---
device_health:
  offline_after_seconds: 60  # no reading in this window -> OFFLINE

# --- Communication ---
mqtt:
  broker_host: "localhost"
  broker_port: 1883
  topic: "storewatch/telemetry"

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"

backend:
  host: "0.0.0.0"
  port: 5000
  http_ingest_endpoint: "/api/readings"

database:
  path: "backend/database/storewatch.db"

# --- Rows of the single RACK_01 cardboard shelf ---
# SHELF_01/02 are retained as legacy row channel IDs.
shelves:
  SHELF_01:
    product: "Tea boxes"
    product_tag: "TEA-001"
    parent_shelf: "RACK_01"
    row_number: 1
    sensor_id: "US_01"
    device_id: "ESP32_01"
    sensor_type: "ultrasonic"
  SHELF_02:
    product: "Biscuits"
    product_tag: "BIS-002"
    parent_shelf: "RACK_01"
    row_number: 2
    sensor_id: "US_02"
    device_id: "ESP32_01"       # same board, independent sensor
    sensor_type: "ultrasonic"
